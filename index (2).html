
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Treino Interativo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js">
    function mostrarUltimoTreino(exKey) {
      const ult = JSON.parse(localStorage.getItem(`${exKey}_historico`) || "[]");
      if (ult.length > 0) {
        const ultReg = ult[ult.length - 1];
        const maxPeso = Math.max(...ultReg.series);
        const ultInfo = document.getElementById(`${exKey}_ultimo`);
        if (ultInfo) {
          ultInfo.innerHTML = `Último treino: ${maxPeso} kg (${ultReg.data})`;
        }
      }
    }
    
    function salvarObservacao(exKey) {
      const val = document.getElementById(`${exKey}_obs`)?.value;
      if (val) localStorage.setItem(`${exKey}_obs`, val);
    }

    function restaurarObservacao(exKey) {
      const val = localStorage.getItem(`${exKey}_obs`);
      if (val && document.getElementById(`${exKey}_obs`)) {
        document.getElementById(`${exKey}_obs`).value = val;
      }
    }

    function restaurarCampos(exKey) {
      const baseVal = localStorage.getItem(`${exKey}_base`);
      if (baseVal !== null) {
        const baseInput = document.getElementById(`${exKey}_base`);
        if (baseInput) {
          baseInput.value = baseVal;
          calc(exKey);
        }
      }
      for (let i = 1; i <= 2; i++) {
        const sid = `${exKey}_serie${i}`;
        const val = localStorage.getItem(sid);
        if (val !== null) {
          const input = document.getElementById(sid);
          if (input) {
            input.value = val;
            save(sid);
          }
        }
      }
      restaurarObservacao(exKey);
    }

    let timerInterval;
    function iniciarTimerGlobal() {
      const display = document.getElementById("globalTimer");
      let seg = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        seg++;
        const min = String(Math.floor(seg / 60)).padStart(2, '0');
        const s = String(seg % 60).padStart(2, '0');
        display.innerText = `⏱️ Descanso: ${min}:${s}`;
      }, 1000);
    }
    </script>
    
    
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      transition: background 0.3s, color 0.3s;
    }
    .sidebar {
      width: 200px;
      background: #333;
      color: #fff;
      height: 100vh;
      padding-top: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.3);
      position: fixed;
    }
    .sidebar button {
      width: 100%;
      padding: 15px;
      border: none;
      background: none;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font-size: 16px;
    }
    .sidebar button:hover {
      background: #444;
    }
    .content {
      margin-left: 200px;
      padding: 20px;
      flex-grow: 1;
      background: #f4f4f4;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    .exercise {
      background: #fff;
      margin-bottom: 25px;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px #ccc;
    }
    .exercise h2 { margin-top: 0; }
    .serie {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .serie label {
      width: 230px;
      display: inline-block;
    }
    input[type='number'] {
      width: 100px;
      padding: 5px;
    }
    .suggestion {
      font-style: italic;
      margin-left: 10px;
      color: #555;
    }
    .dark-mode body,
    .dark-mode .content {
      background: #121212;
      color: #eee;
    }
    .dark-mode .exercise {
      background: #1e1e1e;
      box-shadow: none;
    }
    .dark-mode input[disabled] {
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
    }
    .dark-mode .suggestion {
      color: #aaa;
    }
    .dark-toggle {
      margin: 20px;
      padding: 10px;
      font-size: 14px;
      background: #555;
      color: #fff;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="loadWorkout('A1')">Treino A1</button>
    <button onclick="showGraph()">Gráficos</button>
    <button class="dark-toggle" onclick="toggleDarkMode()">Modo Escuro</button>
  </div>
  
    <div class="content" id="content">
      <div id="globalTimer" style="font-size:18px; font-weight:600; margin-bottom:20px;"></div>
    
    <h1>Treino Interativo</h1>
    <p>Escolha um treino na aba lateral.</p>
  </div>

  <script>
    const treinos = {
      "A1": [
        ["Supino inclinado na máquina", true],
        ["Crucifixo na máquina", false]
      ]
    };

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    function loadWorkout(nome) {
      const content = document.getElementById("content");
      content.innerHTML = `<h1>Treino ${nome}</h1>`;

      treinos[nome].forEach(([ex, precisaAquecimento], index) => {
        const exKey = `${nome}_ex${index}`;
        let html = `<div class="exercise"><h2>${ex}</h2>`;

        if (precisaAquecimento) {
          html += `
            <div class="serie"><label>Peso de trabalho:</label><input type="number" id="${exKey}_base" oninput="calc('${exKey}')"></div>
            <div class="serie"><label>Aquecimento 1 (50%):</label><input disabled type="number" id="${exKey}_aq1"></div>
            <div class="serie"><label>Aquecimento 2 (70%):</label><input disabled type="number" id="${exKey}_aq2"></div>
            <div class="serie"><label>Aquecimento 3 (80%):</label><input disabled type="number" id="${exKey}_aq3"></div>`;
        }

        for (let i = 1; i <= 2; i++) {
          const sid = `${exKey}_serie${i}`;
          html += `
            <div class="serie">
              <label>Série válida ${i}:</label>
              <input type="number" id="${sid}" oninput="save('${sid}')">
              <span class="suggestion" id="${sid}_sug"></span>
              <button onclick="startTimer('${sid}_btn')" id="${sid}_btn">✓</button>
            </div>`;
        }

        html += `<div class='serie'><button onclick="saveProgress('${exKey}')">Salvar Progresso</button></div></div>`;
        content.innerHTML += html;
      });
    }

    function save(id) {
      const el = document.getElementById(id);
      const val = parseFloat(el.value);
      if (!isNaN(val)) {
        localStorage.setItem(id, val);
        const sug = val < 10 ? val + 1 : (val % 2.5 === 0 ? val + 2.5 : Math.round(val + 1));
        document.getElementById(id + "_sug").textContent = `→ Próx: ${sug} kg`;
      } else {
        document.getElementById(id + "_sug").textContent = "";
        localStorage.removeItem(id);
      }
    }

    function calc(exKey) {
      const base = parseFloat(document.getElementById(`${exKey}_base`).value);
      if (!isNaN(base)) {
        document.getElementById(`${exKey}_aq1`).value = (base * 0.5).toFixed(1);
        document.getElementById(`${exKey}_aq2`).value = (base * 0.7).toFixed(1);
        document.getElementById(`${exKey}_aq3`).value = (base * 0.8).toFixed(1);
      }
    }

    function saveProgress(exKey) {
      const date = new Date().toLocaleDateString("pt-BR");
      const key = `${exKey}_historico`;
      const registros = JSON.parse(localStorage.getItem(key) || "[]");
      const entrada = { data: date, series: [] };

      for (let i = 1; i <= 2; i++) {
        const sid = `${exKey}_serie${i}`;
        const val = parseFloat(document.getElementById(sid).value);
        if (!isNaN(val)) entrada.series.push(val);
      }

      if (entrada.series.length) {
        registros.push(entrada);
        localStorage.setItem(key, JSON.stringify(registros));
        alert("Progresso salvo!");
      }
    }

    function showGraph() {
      const content = document.getElementById("content");
      content.innerHTML = `<h1>Gráfico: Supino Inclinado</h1><canvas id="graficoSupino"></canvas>`;

      const key = "A1_ex0_historico";
      const hist = JSON.parse(localStorage.getItem(key) || "[]");
      const labels = hist.map(r => r.data);
      const valores = hist.map(r => Math.max(...r.series));

      new Chart(document.getElementById("graficoSupino"), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Carga Máxima',
            data: valores,
            borderColor: 'blue',
            backgroundColor: 'lightblue',
            tension: 0.2
          }]
        },
        options: {
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function startTimer(btnId) {
      const btn = document.getElementById(btnId);
      let s = 0;
      const original = btn.innerText;
      btn.disabled = true;
      const intv = setInterval(() => {
        s++;
        const min = String(Math.floor(s / 60)).padStart(2, '0');
        const sec = String(s % 60).padStart(2, '0');
        btn.innerText = `${min}:${sec}`;
        if (s >= 300) {
          clearInterval(intv);
          btn.disabled = false;
          btn.innerText = original;
        }
      }, 1000);
    }
  
    function mostrarUltimoTreino(exKey) {
      const ult = JSON.parse(localStorage.getItem(`${exKey}_historico`) || "[]");
      if (ult.length > 0) {
        const ultReg = ult[ult.length - 1];
        const maxPeso = Math.max(...ultReg.series);
        const ultInfo = document.getElementById(`${exKey}_ultimo`);
        if (ultInfo) {
          ultInfo.innerHTML = `Último treino: ${maxPeso} kg (${ultReg.data})`;
        }
      }
    }
    
    function salvarObservacao(exKey) {
      const val = document.getElementById(`${exKey}_obs`)?.value;
      if (val) localStorage.setItem(`${exKey}_obs`, val);
    }

    function restaurarObservacao(exKey) {
      const val = localStorage.getItem(`${exKey}_obs`);
      if (val && document.getElementById(`${exKey}_obs`)) {
        document.getElementById(`${exKey}_obs`).value = val;
      }
    }

    function restaurarCampos(exKey) {
      const baseVal = localStorage.getItem(`${exKey}_base`);
      if (baseVal !== null) {
        const baseInput = document.getElementById(`${exKey}_base`);
        if (baseInput) {
          baseInput.value = baseVal;
          calc(exKey);
        }
      }
      for (let i = 1; i <= 2; i++) {
        const sid = `${exKey}_serie${i}`;
        const val = localStorage.getItem(sid);
        if (val !== null) {
          const input = document.getElementById(sid);
          if (input) {
            input.value = val;
            save(sid);
          }
        }
      }
      restaurarObservacao(exKey);
    }

    let timerInterval;
    function iniciarTimerGlobal() {
      const display = document.getElementById("globalTimer");
      let seg = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        seg++;
        const min = String(Math.floor(seg / 60)).padStart(2, '0');
        const s = String(seg % 60).padStart(2, '0');
        display.innerText = `⏱️ Descanso: ${min}:${s}`;
      }, 1000);
    }
    </script>
    
    
</body>
</html>
