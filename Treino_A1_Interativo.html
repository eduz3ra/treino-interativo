
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Treino A1 - Puxador</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        h1 { text-align: center; }
        .exercise { background: #fff; margin-bottom: 15px; padding: 15px; border-radius: 8px; box-shadow: 0 0 5px #ccc; }
        .exercise h2 { margin-top: 0; }
        .serie { margin-bottom: 8px; }
        input[type='number'] { width: 80px; padding: 5px; margin-left: 10px; }
        .suggestion { font-style: italic; margin-left: 10px; color: #555; }
        button { margin-top: 20px; padding: 10px 15px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Treino A1 – Peito + Tríceps + Ombro</h1>
    <div id="content"></div>
    <button onclick="resetAll()">Resetar Tudo</button>

    <script>
        const treinoA1 = [
            "Puxada alta com puxador anatômico",
            "Supino inclinado na máquina",
            "Crucifixo na máquina",
            "Crossover alto",
            "Desenvolvimento frontal com halteres",
            "Tríceps na corda",
            "Tríceps testa na polia"
        ];

        const content = document.getElementById("content");

        treinoA1.forEach((exercicio, index) => {
            const exKey = 'ex' + index;
            const div = document.createElement("div");
            div.className = "exercise";
            div.innerHTML = `<h2>${exercicio}</h2>`;
            for (let i = 1; i <= 3; i++) {
                const id = `${exKey}_serie${i}`;
                const valor = localStorage.getItem(id) || "";
                div.innerHTML += `
                    <div class="serie">
                        Série ${i}: 
                        <input type="number" id="${id}" value="${valor}" oninput="salvar('${id}')" />
                        <span class="suggestion" id="${id}_sugestao"></span>
                    </div>
                `;
            }
            content.appendChild(div);
        });

        function salvar(id) {
            const input = document.getElementById(id);
            const valor = parseFloat(input.value);
            if (!isNaN(valor)) {
                localStorage.setItem(id, valor);
                let sugestao = valor < 10 ? valor + 1 : (valor % 2.5 === 0 ? valor + 2.5 : Math.round(valor + 1));
                document.getElementById(id + "_sugestao").textContent = `→ Próx: ${sugestao} kg`;
            } else {
                localStorage.removeItem(id);
                document.getElementById(id + "_sugestao").textContent = "";
            }
        }

        function resetAll() {
            if (confirm("Tem certeza que quer resetar tudo?")) {
                localStorage.clear();
                location.reload();
            }
        }

        window.onload = () => {
            document.querySelectorAll("input[type='number']").forEach(input => {
                input.dispatchEvent(new Event("input"));
            });
        };
    </script>
</body>
</html>
